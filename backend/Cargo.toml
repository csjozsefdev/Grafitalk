[package]
name = "backend"
version = "1.0.0"
edition = "2021"

[lib]
name = "backend"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
printpdf = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
